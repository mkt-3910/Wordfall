# 既定はローカル実行向け(自分のPCからだけ接続できる)。公開時は prod プロファイルを使う。
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# ローカルでも再起動後にデータが残るファイルDB。
# 本番では環境変数 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD で上書きする。
spring.datasource.url=jdbc:h2:file:./data/wordfall
spring.datasource.username=sa
spring.datasource.password=

# テーブルは Flyway(src/main/resources/db/migration)で作り、Hibernate は定義との一致だけを確認する。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# 静的ファイルの URL に内容のハッシュを付け、ブラウザに長くキャッシュさせる。
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d

server.error.whitelabel.enabled=false

# プレイヤー識別 Cookie。HTTPS で公開するときは true にする。
wordfall.cookie.secure=${COOKIE_SECURE:false}
wordfall.rate-limit.posts-per-minute=300
wordfall.rate-limit.starts-per-minute=20
