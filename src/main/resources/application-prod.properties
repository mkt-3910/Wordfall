# 公開環境用(SPRING_PROFILES_ACTIVE=prod)。
# HTTPS を終端するリバースプロキシ(ロードバランサー)の後ろで動かす前提。
server.address=0.0.0.0
server.forward-headers-strategy=native
server.shutdown=graceful

# DB の接続先。SPRING_DATASOURCE_URL(JDBC 形式)を指定するか、DB_HOST / DB_PORT / DB_NAME から組み立てる(Render の render.yaml はこちら)。
# どちらも無いときは起動を失敗させる(未指定のまま同梱の H2 がメモリ上で使われ、再起動でデータが消えるのを防ぐ)。
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.flyway.fail-on-missing-locations=true

wordfall.cookie.secure=${COOKIE_SECURE:true}
