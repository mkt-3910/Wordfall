# 公開環境用(SPRING_PROFILES_ACTIVE=prod)。
# HTTPS を終端するリバースプロキシ(ロードバランサー)の後ろで動かす前提。
server.address=0.0.0.0
server.forward-headers-strategy=native
server.shutdown=graceful

# DB は環境変数 SPRING_DATASOURCE_URL などで必ず指定する(例: jdbc:postgresql://host:5432/wordfall)。
spring.datasource.url=
spring.flyway.fail-on-missing-locations=true

wordfall.cookie.secure=${COOKIE_SECURE:true}
