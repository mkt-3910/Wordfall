# main の application.properties を読み込んだうえで、テスト用に上書きする値だけを書く。
# 環境変数 SPRING_DATASOURCE_URL などを指定すると、そのDB(PostgreSQLなど)でテストできる。
spring.datasource.url=jdbc:h2:mem:wordfall-test;DB_CLOSE_DELAY=-1
logging.level.root=WARN

# テストでは大量の着地を送るため、回数制限は専用のテスト(RateLimitTest)でだけ確認する
wordfall.rate-limit.posts-per-minute=1000000
wordfall.rate-limit.starts-per-minute=1000000
