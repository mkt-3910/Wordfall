name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: wordfall
          POSTGRES_DB: wordfall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java tests (H2)
        run: mvn --batch-mode verify
      - name: Java tests (PostgreSQL, same as production)
        run: mvn --batch-mode test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/wordfall_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: wordfall
      - name: JavaScript tests
        run: node --test src/test/js/*.test.cjs
